services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    command: postgres -c max_connections=100 -c shared_buffers=256MB -c effective_cache_size=512MB
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fichajes}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-fichajes}"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 512m
    mem_reservation: 128m
    networks:
      - default

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    labels:
      - "traefik.docker.network=coolify"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-fichajes}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      CORS_ORIGINS: '${CORS_ORIGINS:-["http://localhost:3000"]}'
      APP_ENV: ${APP_ENV:-production}
      APP_URL: ${APP_URL:-https://kronos.klyp.es}
    volumes:
      - storage_data:/app/storage
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    mem_limit: 1024m
    mem_reservation: 512m
    networks:
      - default
      - coolify

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    labels:
      - "traefik.docker.network=coolify"
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3000/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    mem_limit: 640m
    mem_reservation: 256m
    networks:
      - default
      - coolify

# ─── Volumes ──────────────────────────────────────────────────────────────────
# external: true + name fijo evita que Coolify cree volúmenes nuevos en cada
# redeploy (cada proyecto Coolify tiene un UUID diferente en el prefijo).
# Crear 1 vez en el servidor:
#   docker volume create kronos_pgdata
#   docker volume create kronos_storage_data
# Migrar datos del volumen anterior si es necesario (ver README o CLAUDE.md).
volumes:
  pgdata:
    external: true
    name: kronos_pgdata
  storage_data:
    external: true
    name: kronos_storage_data

networks:
  default:
  coolify:
    external: true
    name: coolify
